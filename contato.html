<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BonsaiTech - Fale Conosco</title>
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #fafafa; color: #2d3748; line-height: 1.6; }

    .gradient-bg {
      background: linear-gradient(135deg, #1b4332 0%, #40916c 50%, #39785c 100%);
      color: white;
    }

    header { padding: 30px 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    header h1 { font-size: 32px; font-weight: 700; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }

    nav ul { list-style: none; display: flex; gap: 30px; }
    nav a { color: white; text-decoration: none; font-weight: 600; font-size: 16px; border-bottom: 2px solid transparent; transition: border 0.3s; }
    nav a:hover { border-bottom: 2px solid white; }

    main { padding: 60px 20px; max-width: 800px; margin: 0 auto; }

    h2 { font-size: 38px; color: #1b4332; margin-bottom: 10px; text-align: center; }
    .desc-contato { text-align: center; margin-bottom: 40px; color: #4a5568; }

    fieldset { border: 2px solid #39785c; border-radius: 8px; padding: 25px; background-color: white; }
    legend { font-weight: bold; color: #1b4332; padding: 0 10px; font-size: 20px; }

    table { width: 100%; border-collapse: collapse; }
    td { padding: 12px; vertical-align: middle; }
    td:first-child { width: 35%; text-align: right; font-weight: 600; color: #2d3748; }

    input[type="text"], input[type="email"], input[type="tel"], input[type="number"], input[type="date"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
    }

    .botoesContainer { text-align: center; padding-top: 20px; }
    .btn-submit { background-color: #1b4332; color: white; padding: 12px 30px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    .btn-submit:hover { background-color: #0f291e; }
    .btn-reset { background-color: #e2e8f0; color: #2d3748; padding: 12px 30px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 10px; transition: background 0.3s; }
    .btn-reset:hover { background-color: #cbd5e0; }

    footer { padding: 50px 20px; text-align: center; margin-top: 60px; }
    footer p { font-size: 15px; opacity: 0.9; }
  </style>
</head>
<body>

<header class="gradient-bg">
  <h1>BonsaiTech</h1>
  <nav>
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="produtos.html">Catálogo</a></li>
      <li><a href="contato.html">Fale Conosco</a></li>
    </ul>
  </nav>
</header>

<main>
  <h2>Fale Conosco</h2>
  <p class="desc-contato">Preencha o formulário abaixo para dimensionar a carga do seu setup, não vamos fazer spam, não se acanhe!</p>

  <form action="" method="get">
    <fieldset>
      <legend>Dados do Projeto</legend>

      <table>

        <tr>
          <td><label for="nome">Nome Completo:</label></td>
          <td><input type="text" id="nome" name="nome" placeholder="Digite seu nome" required autofocus
                  oninvalid="this.setCustomValidity('Opa! Faltou um nome aqui, hein?')"
                  oninput="this.setCustomValidity('')">
          </td>
        </tr>

        <tr>
          <td><label for="email">E-mail de Contato:</label></td>
          <td><input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required
                     oninvalid="this.setCustomValidity('Opa! Acho que o e-mail está inválido')"
                     oninput="this.setCustomValidity('')">
          </td>
        </tr>

        <tr>
          <td><label for="telefone">WhatsApp:</label></td>
          <td>
            <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" pattern="\([0-9]{2}\)\s[0-9]{5}-[0-9]{4}" title="Insira neste formato, não se esqueça do espaço!: (XX) XXXXX-XXXX" required
            oninvalid="this.setCustomValidity('Número inválido, poderia verificar?')"
            oninput="this.setCustomValidity('')">
          </td>
        </tr>

        <tr>
          <td><label for="servico">Tipo de Serviço:</label></td>
          <td>
            <select id="servico" name="servico" required>
              <option value="">Selecione uma opção...</option>
              <optgroup label="Infraestrutura">
                <option value="homelab">Homelab Sustentável</option>
                <option value="servidor">Servidor 24/7</option>
              </optgroup>
              <optgroup label="Energia">
                <option value="solar">Geração Solar</option>
              </optgroup>
            </select>
          </td>
        </tr>

        <tr>
          <td><label for="potencia">Consumo estimado (kWh):</label></td>
          <td>
            <input type="number" id="potencia" name="potencia" min="50" max="2000" placeholder="Ex: 200" required
                   oninvalid="this.setCustomValidity('Por favor, informe um valor válido entre 50 e 2000 kWh.')"
                   oninput="this.setCustomValidity('')">
          </td>
        </tr>

        <tr>
          <td><label for="data">Data de Início Desejada:</label></td>
          <td><input type="date" id="data" name="data" min="2026-09-01"
                     oninvalid="this.setCustomValidity('Não se esqueça de inserir uma data com antecedência, e também nenhuma que já passou!')"
                     oninput="this.setCustomValidity('')">
          </td>
        </tr>

        <tr>
          <td><label for="detalhes">Detalhes adicionais:</label></td>
          <td>
            <textarea id="detalhes" name="detalhes" rows="4" placeholder="Descreva as particularidades da sua instalação..." required
                      oninvalid="this.setCustomValidity('Não se esqueça de nos fornecer mais detalhes, será de grande ajuda!')"
                      oninput="this.setCustomValidity('')"></textarea>
          </td>
        </tr>

        <tr>
          <td></td>
          <td style="padding-top: 10px;">
            <input type="checkbox" id="termos" name="termos" value="aceito" required
                   oninvalid="this.setCustomValidity('Só falta assinalar, assim poderemos continuar com o contato :) ')"
                   oninput="this.setCustomValidity('')"></textarea>
            <label for="termos" style="font-size: 14px; color: #4a5568;">Aceito receber contato da equipe técnica.</label>
          </td>
        </tr>

        <tr>
          <td colspan="2" class="botoesContainer">
            <input type="submit" value="Enviar Solicitação" class="btn-submit">
            <input type="reset" value="Limpar Formulário" class="btn-reset">
          </td>
        </tr>

      </table>
    </fieldset>
  </form>
</main>

<footer class="gradient-bg">
  <p>Gabriel Cedraschi Dias de Araujo - ADS</p>
  <p>RA: 10791976</p>
</footer>

</body>
</html>
