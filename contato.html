<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BonsaiTech - Fale Conosco</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="gradient-bg">
  <h1>BonsaiTech</h1>
  <nav>
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="produtos.html">Catálogo</a></li>
      <li><a href="contato.html">Fale Conosco</a></li>
    </ul>
  </nav>
</header>

<main class="main-contato">
  <h2 class="titulo-contato">Fale Conosco</h2>
  <p class="desc-contato">Preencha o formulário abaixo para dimensionar a carga do seu setup, não vamos fazer spam, não se acanhe!</p>

  <form action="" method="get">
    <fieldset>
      <legend>Dados do Projeto</legend>

      <table>
        <tr>
          <td><label for="nome">Nome Completo:</label></td>
          <td><input type="text" id="nome" name="nome" placeholder="Digite seu nome" required autofocus
                  oninvalid="this.setCustomValidity('Opa! Faltou um nome aqui, hein?')"
                  oninput="this.setCustomValidity('')">
          </td>
        </tr>

        <tr>
          <td><label for="email">E-mail de Contato:</label></td>
          <td><input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required
                     oninvalid="this.setCustomValidity('Opa! Acho que o e-mail está inválido')"
                     oninput="this.setCustomValidity('')">
          </td>
        </tr>

        <tr>
          <td><label for="telefone">WhatsApp:</label></td>
          <td>
            <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" pattern="\([0-9]{2}\)\s[0-9]{5}-[0-9]{4}" title="Insira neste formato, não se esqueça do espaço!: (XX) XXXXX-XXXX" required
            oninvalid="this.setCustomValidity('Número inválido, poderia verificar?')"
            oninput="this.setCustomValidity('')">
          </td>
        </tr>

        <tr>
          <td><label for="servico">Tipo de Serviço:</label></td>
          <td>
            <select id="servico" name="servico" required>
              <option value="">Selecione uma opção...</option>
              <optgroup label="Infraestrutura">
                <option value="homelab">Homelab Sustentável</option>
                <option value="servidor">Servidor 24/7</option>
              </optgroup>
              <optgroup label="Energia">
                <option value="solar">Geração Solar</option>
              </optgroup>
            </select>
          </td>
        </tr>

        <tr>
          <td><label for="potencia">Consumo estimado (kWh):</label></td>
          <td>
            <input type="number" id="potencia" name="potencia" min="50" max="2000" placeholder="Ex: 200" required
                   oninvalid="this.setCustomValidity('Por favor, informe um valor válido entre 50 e 2000 kWh.')"
                   oninput="this.setCustomValidity('')">
          </td>
        </tr>

        <tr>
          <td><label for="data">Data de Início Desejada:</label></td>
          <td><input type="date" id="data" name="data" min="2026-09-01"
                     oninvalid="this.setCustomValidity('Não se esqueça de inserir uma data com antecedência, e também nenhuma que já passou!')"
                     oninput="this.setCustomValidity('')">
          </td>
        </tr>

        <tr>
          <td><label for="detalhes">Detalhes adicionais:</label></td>
          <td>
            <textarea id="detalhes" name="detalhes" rows="4" placeholder="Descreva as particularidades da sua instalação..." required
                      oninvalid="this.setCustomValidity('Não se esqueça de nos fornecer mais detalhes, será de grande ajuda!')"
                      oninput="this.setCustomValidity('')"></textarea>
          </td>
        </tr>

        <tr>
          <td></td>
          <td class="celula-checkbox">
            <input type="checkbox" id="termos" name="termos" value="aceito" required
                   oninvalid="this.setCustomValidity('Só falta assinalar, assim poderemos continuar com o contato :) ')"
                   oninput="this.setCustomValidity('')">
            <label for="termos" class="label-termos">Aceito receber contato da equipe técnica.</label>
          </td>
        </tr>

        <tr>
          <td colspan="2" class="botoesContainer">
            <input type="submit" value="Enviar Solicitação" class="btn-submit">
            <input type="reset" value="Limpar Formulário" class="btn-reset">
          </td>
        </tr>

      </table>
    </fieldset>
  </form>
</main>

<footer class="gradient-bg">
  <p>Gabriel Cedraschi Dias de Araujo - ADS</p>
  <p>RA: 10791976</p>
</footer>

</body>
</html>
